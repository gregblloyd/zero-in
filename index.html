<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Zero In</title>
<style>
:root{
  --bg:#141816; --panel:#1d2320; --panel2:#252c28; --line:#344039; --text:#eef0ea; --dim:#9aa59c;
  --accent:#e8a33d; --accent-ink:#1a1206; --good:#7cc47a; --bad:#e8664f; --shot:#e8664f; --center:#4fb3e8;
  --target-bg:#f3f1ea; --target-line:#c9c6bb; --target-ink:#222;
  --r:14px; --tap:52px;
}
:root[data-theme="light"]{
  --bg:#f4f2ec; --panel:#ffffff; --panel2:#ece9e1; --line:#d4d0c4; --text:#141614; --dim:#5d645e;
  --accent:#b8700f; --accent-ink:#fff; --good:#2e7d32; --bad:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;letter-spacing:.02em;flex:1}
header select{max-width:62%}
main{padding:14px 16px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:11.5px;font-weight:600;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 0 8px}
h2:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:0 0 4px}
.field{margin-bottom:12px}
input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:var(--tap)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:650;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:40px;padding:0 12px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--dim);min-height:44px;border-radius:9px;font-weight:650}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--dim);font-size:14px}
.tiny{font-size:12.5px;color:var(--dim)}
/* Target */
.target-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--target-bg);touch-action:manipulation;border:1px solid var(--line)}
.target-wrap svg{display:block;width:100%;height:auto}
.tool{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.tool .btn{flex:1}
/* Answer */
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dial{background:var(--panel);border:2px solid var(--accent);border-radius:var(--r);padding:12px;text-align:center}
.dial.ok{border-color:var(--good)}
.dial .k{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.dial .dir{font-size:22px;font-weight:800;margin-top:2px;white-space:nowrap}
.dial .clicks{font-size:46px;font-weight:800;line-height:1;margin:4px 0}
.dial .sub{font-size:13px;color:var(--dim)}
.dial .dir{display:flex;align-items:center;justify-content:center;gap:4px}
.dial .dir svg{width:26px;height:26px;color:var(--accent)}
.dial .unit{font-size:15px;font-weight:800;letter-spacing:.12em;color:var(--dim);margin-top:-2px}
.dial .turn{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;white-space:nowrap}
.dial .turn svg{width:17px;height:17px;color:var(--accent);flex:none}
.dial .turn b{font-size:17px}
.how{margin-top:10px;font-size:15px;background:var(--panel2);border-radius:12px;padding:12px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.stat:last-child{border:0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:650}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.pill.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.good{color:var(--good);border-color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{background:color-mix(in srgb,var(--good) 16%,transparent)}
.warn{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel));padding:10px 12px;border-radius:10px;font-size:14px;margin:10px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:99px;padding:8px 14px;font-weight:600;min-height:40px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;font-weight:650;min-height:40px;display:flex;align-items:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
.sheet .inner{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet .bar h3{flex:1;margin:0;font-size:19px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;z-index:30;max-width:90vw}
.empty{text-align:center;padding:24px 8px;color:var(--dim)}
.chart{width:100%;height:auto;display:block}
.quick{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:616px;margin:0 auto}
.quick span{white-space:nowrap;display:flex;flex-direction:column;flex:1}.quick span+span{border-left:1px solid rgba(0,0,0,.2);padding-left:14px}.quick small{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.85}.quick b{font-size:22px;font-weight:850}
.quick .tiny{color:var(--accent-ink);opacity:.8}
body:has(.quick){padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.quick[hidden]{display:none}
.offline{font-size:12px;font-weight:700;color:var(--good)}
.offline.no{color:var(--dim)}

/* Spotter */
.spot-head{display:flex;gap:8px;margin-bottom:10px}
.spot-head select{flex:1;min-height:44px;padding:8px 10px;font-weight:650}
.spot-head .btn{flex:1.3;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:40px}
.sol{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));border:2px solid var(--accent);border-radius:18px;padding:14px;margin-bottom:12px}
.sol-call{font-size:17px;font-weight:700;text-align:center;margin-bottom:12px;line-height:1.3}
.sol-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sol-box{background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center}
.sol-box .k{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.sol-box .big{font-size:40px;font-weight:850;line-height:1.05;margin-top:6px;white-space:nowrap}
.sol-box .u{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.turn2{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;white-space:nowrap}
.turn2 svg{width:16px;height:16px;color:var(--accent);flex:none}
.turn2 b{font-size:16px}
.sol-stats{display:flex;justify-content:space-between;gap:6px;margin-top:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.sol-stats span{display:flex;flex-direction:column;align-items:center;flex:1}
.sol-stats b{font-size:15px;color:var(--text)}
.sol-box{min-width:0}
.turn2.tight{margin-top:2px;padding-top:0;border-top:0}
.wnote{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.3}
.sol-box .exact{font-size:11.5px;color:var(--dim);margin-top:1px}
.sol-warn{margin-top:8px;color:var(--bad);text-align:center}
.in-card{padding:12px 14px}
.in-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.in-label{width:62px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.stepper{flex:1;display:flex;align-items:center;gap:6px;position:relative}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:26px;font-weight:600;flex:none}
.stepper input.big{text-align:center;font-size:24px;font-weight:800;padding:8px 34px 8px 8px}
.stepper .unit-s{position:absolute;right:66px;color:var(--dim);font-size:13px;font-weight:700;pointer-events:none}
.clock-wrap{display:flex;flex-direction:column;align-items:center;margin:4px 0 8px}
.clock{width:220px;height:220px;touch-action:manipulation}
.ck-ring{fill:var(--panel2);stroke:var(--line)}
.ck-inner{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.ck-h circle{fill:var(--panel);stroke:var(--line);cursor:pointer}
.ck-h text{fill:var(--text);font-size:15px;font-weight:700;pointer-events:none}
.ck-h.on circle{fill:var(--center);stroke:var(--center)}
.ck-h.on text{fill:#06141c}
.ck-arrow{stroke:var(--center);stroke-width:4;stroke-linecap:round}
.ck-target{fill:var(--accent)}
.ck-tl{fill:var(--dim);font-size:9px;font-weight:800;letter-spacing:.1em}
.ck-me{fill:var(--text)}
.clock-note{font-size:14px;color:var(--dim);margin-top:2px}
.angle-read{font-size:64px;font-weight:850;text-align:center;margin:10px 0 4px}
</style>
</head>
<body>
<header>
  <h1>Zero In</h1>
  <span id="netstate" class="offline no"></span>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="zero" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg>Zero</button>
  <button data-tab="spot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4M17 12h4M12 3v4M12 17v4"/><circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 2"/></svg>Spotter</button>
  <button data-tab="rifles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 14h13l3-3h4v3l-3 2H9l-2 4H4l1-4H2z"/><path d="M8 11h6"/></svg>Rifles</button>
  <button data-tab="loads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 22V9l3-6 3 6v13z"/><path d="M9 14h6"/></svg>Loads</button>
  <button data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h8"/></svg>Data</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</nav>
<script src="drag.js?v=10"></script>
<script src="ballistics.js?v=10"></script>
<script src="app.js?v=10"></script>
<script src="spotter.js?v=10"></script>
</body>
</html>
